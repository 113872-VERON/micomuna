openapi: 3.1.0
info:
  title: MiComuna API
  description: Gestor de reclamos municipales
  version: 0.0.1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Comunas
  description: Consulta pública de una comuna por su enlace
- name: Administración
  description: "Acceso del superadmin de la plataforma, que no pertenece a ninguna\
    \ comuna"
- name: Mi cuenta
  description: "Acciones de quien ya inició sesión, sea cual sea su rol"
- name: Autenticación
  description: Registro e inicio de sesión de los usuarios de una comuna
- name: Salud
  description: Comprobación de que el backend responde
paths:
  /api/comunas/{slug}/restablecer-clave:
    post:
      tags:
      - Autenticación
      summary: Elegir una contraseña nueva con el código del correo
      description: "El código sirve una sola vez. Un código inexistente, vencido,\
        \ usado o de otra comuna responde lo mismo: 400 CODIGO_INVALIDO."
      operationId: restablecerClave
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerClaveRequest"
        required: true
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: Datos inválidos o código inválido (CODIGO_INVALIDO)
        "404":
          description: La comuna no existe o está inactiva
  /api/comunas/{slug}/registro:
    post:
      tags:
      - Autenticación
      summary: Registrar un vecino
      description: Crea una cuenta de vecino en la comuna y devuelve el token para
        seguir con la sesión iniciada. El rol siempre es VECINO.
      operationId: registrar
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroRequest"
        required: true
      responses:
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
        "404":
          description: La comuna no existe o está inactiva
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
        "409":
          description: Ese correo ya está registrado en la comuna
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
  /api/comunas/{slug}/recuperar-clave:
    post:
      tags:
      - Autenticación
      summary: Pedir el correo para recuperar la contraseña
      description: "Responde siempre 202, exista o no la cuenta, para no revelar qué\
        \ correos están registrados. Si la cuenta existe y está activa, le llega un\
        \ enlace de un solo uso que vence en 60 minutos. Quien todavía no eligió su\
        \ contraseña recibe una invitación nueva."
      operationId: recuperarClave
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecuperarClaveRequest"
        required: true
      responses:
        "202":
          description: Pedido recibido
        "400":
          description: Correo inválido
        "404":
          description: La comuna no existe o está inactiva
  /api/comunas/{slug}/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión en una comuna
      description: "Devuelve el token y los datos del usuario. Cualquier falla de\
        \ credenciales responde lo mismo: 401 «Credenciales incorrectas». El superadmin\
        \ no entra por acá."
      operationId: iniciarSesion
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
        "401":
          description: Credenciales incorrectas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
        "404":
          description: La comuna no existe o está inactiva
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
  /api/comunas/{slug}/aceptar-invitacion:
    post:
      tags:
      - Autenticación
      summary: Aceptar una invitación eligiendo la contraseña
      description: Con el código del correo de invitación (vence en 72 horas y sirve
        una vez). Después la persona ingresa por el login normal.
      operationId: aceptarInvitacion
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerClaveRequest"
        required: true
      responses:
        "204":
          description: Contraseña elegida
        "400":
          description: Datos inválidos o código inválido (CODIGO_INVALIDO)
        "404":
          description: La comuna no existe o está inactiva
  /api/auth/cambiar-clave:
    post:
      tags:
      - Mi cuenta
      summary: Cambiar mi contraseña
      description: Cambia la contraseña de quien tiene la sesión iniciada. Los tokens
        ya emitidos siguen valiendo hasta que venzan.
      operationId: cambiarClave
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarClaveRequest"
        required: true
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: "La contraseña actual no es correcta, la nueva no cumple las\
            \ reglas o es igual a la actual"
        "401":
          description: Sin sesión
      security:
      - bearerAuth: []
  /api/admin/login:
    post:
      tags:
      - Administración
      summary: Iniciar sesión como superadmin
      description: Solo el superadmin entra por acá. Cualquier falla de credenciales
        responde 401 «Credenciales incorrectas».
      operationId: iniciarSesion_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
        "401":
          description: Credenciales incorrectas
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
  /api/admin/comunas:
    get:
      tags:
      - Administración
      summary: Listar todas las comunas
      description: Incluye las inactivas. No trae la imagen del logo.
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComunaAdminDto"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
      security:
      - bearerAuth: []
    post:
      tags:
      - Administración
      summary: Crear una comuna con su administrador
      description: "Crea la comuna y a su administrador, sin contraseña: elige la\
        \ suya con la invitación por correo. Si no se manda el enlace, se arma con\
        \ el nombre y la provincia. Las comunas no se borran, solo se desactivan."
      operationId: crear
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearComunaRequest"
        required: true
      responses:
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "400":
          description: Datos inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaCreadaDto"
        "403":
          description: Solo el superadmin
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaCreadaDto"
        "409":
          description: Ya existe una comuna con ese enlace
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaCreadaDto"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaCreadaDto"
      security:
      - bearerAuth: []
  /api/admin/comunas/{id}/administrador/reenviar-invitacion:
    post:
      tags:
      - Administración
      summary: Reenviar la invitación al administrador de una comuna
      description: Para cuando el correo no salió o se perdió. Genera un enlace nuevo
        y deja sin efecto el anterior. Si el correo no sale responde 502 CORREO_NO_ENVIADO.
      operationId: reenviarInvitacion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Solo el superadmin
        "404":
          description: La comuna no existe
        "409":
          description: El administrador ya eligió su contraseña
        "502":
          description: El correo no pudo enviarse
        "204":
          description: No Content
      security:
      - bearerAuth: []
  /api/admin/comunas/{id}:
    patch:
      tags:
      - Administración
      summary: Cambiar una comuna
      description: "Cambio parcial de nombre, color, departamento y activa. El enlace\
        \ no se puede cambiar. Desactivarla impide el ingreso de sus usuarios y su\
        \ consulta pública."
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarComunaRequest"
        required: true
      responses:
        "404":
          description: La comuna no existe
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaAdminDto"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
      security:
      - bearerAuth: []
  /api/salud:
    get:
      tags:
      - Salud
      summary: Estado del backend
      operationId: estado
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/prueba/yo:
    get:
      tags:
      - ruta-protegida-de-prueba
      operationId: yo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/comunas/{slug}:
    get:
      tags:
      - Comunas
      summary: Datos públicos de una comuna
      description: Sirve para armar la cabecera de las pantallas de ingreso. No requiere
        sesión.
      operationId: buscar
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: La comuna no existe o está inactiva
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaDto"
components:
  schemas:
    RestablecerClaveRequest:
      type: object
      properties:
        codigo:
          type: string
          description: Código que vino en el enlace del correo
          maxLength: 100
          minLength: 0
        claveNueva:
          type: string
          format: password
          description: De 8 a 72 caracteres
      required:
      - codigo
    RegistroRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          minLength: 0
        correo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        clave:
          type: string
          format: password
          description: De 8 a 72 caracteres
      required:
      - correo
      - nombre
    AuthRespuesta:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/UsuarioDto"
    UsuarioDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        correo:
          type: string
        rol:
          type: string
          enum:
          - VECINO
          - ADMINISTRATIVO
          - AGENTE
          - ADMIN_COMUNA
          - SUPERADMIN
        comunaSlug:
          type: string
    RecuperarClaveRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          minLength: 1
      required:
      - correo
    LoginRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        clave:
          type: string
          format: password
          maxLength: 200
          minLength: 0
      required:
      - clave
      - correo
    CambiarClaveRequest:
      type: object
      properties:
        claveActual:
          type: string
          format: password
          minLength: 1
        claveNueva:
          type: string
          format: password
          description: "De 8 a 72 caracteres, distinta de la actual"
      required:
      - claveActual
    CrearComunaRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          minLength: 0
        provincia:
          type: string
          enum:
          - BUENOS_AIRES
          - CABA
          - CATAMARCA
          - CHACO
          - CHUBUT
          - CORDOBA
          - CORRIENTES
          - ENTRE_RIOS
          - FORMOSA
          - JUJUY
          - LA_PAMPA
          - LA_RIOJA
          - MENDOZA
          - MISIONES
          - NEUQUEN
          - RIO_NEGRO
          - SALTA
          - SAN_JUAN
          - SAN_LUIS
          - SANTA_CRUZ
          - SANTA_FE
          - SANTIAGO_DEL_ESTERO
          - TIERRA_DEL_FUEGO
          - TUCUMAN
        slug:
          type: string
          description: "Enlace de la comuna. Si falta, se arma con el nombre y la\
            \ provincia (salsipuedes-cordoba). No se puede cambiar después."
          maxLength: 120
          minLength: 0
          pattern: "[a-z0-9]+(-[a-z0-9]+)*"
        color:
          type: string
          description: "Color de la paleta. Si falta, CELESTE."
          enum:
          - CELESTE
          - MARINO
          - VERDE_AZULADO
          - BOSQUE
          - CIRUELA
          - OCRE
          - PIZARRA
        departamento:
          type: string
          maxLength: 80
          minLength: 0
        adminCorreo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        adminNombre:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - adminCorreo
      - adminNombre
      - nombre
      - provincia
    ComunaAdminDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        provincia:
          type: string
        slug:
          type: string
        activa:
          type: boolean
        color:
          type: string
        departamento:
          type: string
        tieneLogo:
          type: boolean
    ComunaCreadaDto:
      type: object
      properties:
        comuna:
          $ref: "#/components/schemas/ComunaAdminDto"
        adminCorreo:
          type: string
        invitacionEnviada:
          type: boolean
    ActualizarComunaRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          minLength: 1
        activa:
          type: boolean
        color:
          type: string
          enum:
          - CELESTE
          - MARINO
          - VERDE_AZULADO
          - BOSQUE
          - CIRUELA
          - OCRE
          - PIZARRA
        departamento:
          type: string
          description: Un texto vacío borra el departamento.
          maxLength: 80
          minLength: 0
    ComunaDto:
      type: object
      properties:
        nombre:
          type: string
        provincia:
          type: string
        departamento:
          type: string
        slug:
          type: string
        tieneLogo:
          type: boolean
        color:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
