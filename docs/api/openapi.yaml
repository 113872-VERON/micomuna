                format: binary
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: "La foto o el reclamo no existen, o no son tuyos (NO_ENCONTRADO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/agente/reclamos/{numero}/empezar:
    post:
      tags:
      - Agente
      summary: Empezar a trabajar
      description: "Solo el agente asignado. Pasa el reclamo de ASIGNADO a EN_REPARACION\
        \ y lo registra en el historial con quién y cuándo."
      operationId: empezarReclamo
      parameters:
      - $ref: "#/components/parameters/NumeroReclamo"
      responses:
        "200":
          description: El detalle actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclamoAgenteDetalleDto"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: "El reclamo no existe, es de otra comuna o no está asignado a vos (NO_ENCONTRADO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: "El reclamo no está en ASIGNADO (TRANSICION_INVALIDA), o otra\
            \ persona lo está cambiando en este momento (CONFLICTO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/agente/reclamos/{numero}/resolver:
    post:
      tags:
      - Agente
      summary: Marcar como resuelto
      description: "Solo el agente asignado. Pasa el reclamo de EN_REPARACION a RESUELTO,\
        \ con una nota de lo que se hizo y una foto del trabajo, las dos opcionales.\
        \ La nota la ve el vecino. La foto pasa por los mismos controles que las del\
        \ vecino (JPG o PNG real, hasta 2 MB y 2560 px, sin datos ocultos) y se guarda\
        \ como foto del trabajo. Si el reclamo ya tenía fotos del trabajo de una resolución\
        \ anterior, se reemplazan."
      operationId: resolverReclamo
      parameters:
      - $ref: "#/components/parameters/NumeroReclamo"
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ResolverReclamoForm"
            encoding:
              foto:
                contentType: "image/jpeg, image/png"
      responses:
        "200":
          description: El detalle actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclamoAgenteDetalleDto"
        "400":
          description: "Nota de más de 1000 caracteres (VALIDACION), foto inválida (FOTO_INVALIDA)\
            \ o pedido demasiado grande (ARCHIVO_MUY_GRANDE)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: "El reclamo no existe, es de otra comuna o no está asignado a vos (NO_ENCONTRADO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: "El reclamo no está en EN_REPARACION (TRANSICION_INVALIDA), o otra\
            \ persona lo está cambiando en este momento (CONFLICTO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "503":
          description: "El servidor está procesando muchas fotos a la vez (OCUPADO). Probá\
            \ de nuevo en unos segundos."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/panel/metricas:
    get:
      tags:
      - Panel de reclamos
      summary: Métricas simples de la comuna
      description: "Personal administrativo y administrador de la comuna. Solo reclamos\
        \ de la comuna del token. Las fechas son días de calendario en hora de Argentina\
        \ (America/Argentina/Buenos_Aires) y el rango incluye los dos extremos. Sin\
        \ fechas, los últimos 30 días hasta hoy. Si se manda una, hay que mandar las\
        \ dos. Rango máximo: 366 días.\n\nQué cuenta cada número:\n- reclamosDelPeriodo:\
        \ los creados en el rango, en cualquier estado (incluidos los descartados).\n\
        - resueltos: los que pasaron a RESUELTO dentro del rango (por la última vez\
        \ que pasaron), aunque se hayan creado antes.\n- tiempoPromedioResolucionHoras:\
        \ de esos resueltos, el promedio entre la creación y esa resolución. Vacío\
        \ si no hay resueltos.\n- sinAsignar: de los creados en el rango, los que hoy\
        \ siguen en RECIBIDO.\n- porTipo y porSemana: sobre los creados en el rango.\
        \ Las semanas van de lunes a domingo; la primera y la última se recortan al\
        \ rango y se incluyen las semanas con 0."
      operationId: metricasDelPanel
      parameters:
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricasDto"
        "400":
          description: "Fecha mal escrita o solo una de las dos (VALIDACION), desde posterior\
            \ a hasta (FECHAS_INVALIDAS), o más de 366 días (RANGO_MUY_LARGO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/admin/comunas/{id}/limite:
    put:
      tags:
      - Administración
      summary: Cargar o reemplazar el límite geográfico de una comuna
      description: "Solo el superadmin. El cuerpo es el contenido del archivo GeoJSON.\
        \ Se acepta un Polygon o un MultiPolygon, solo o dentro de un Feature o de\
        \ un FeatureCollection con una sola figura. Las coordenadas van en grados (longitud,\
        \ latitud), como manda GeoJSON. Hasta 1 MB. Se guarda solo la figura, sin las\
        \ propiedades del archivo."
      operationId: cambiarLimite
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GeoJSON (Polygon, MultiPolygon, Feature o FeatureCollection)
      responses:
        "200":
          description: Límite guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComunaAdminDto"
        "400":
          description: "El archivo no es un GeoJSON válido, no tiene un polígono, tiene\
            \ más de una figura, coordenadas fuera de rango o un polígono que se corta\
            \ a sí mismo (LIMITE_INVALIDO), o pesa más de 1 MB"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: La comuna no existe (NO_ENCONTRADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/mi-comuna/limite:
    get:
      tags:
      - Reclamos
      summary: Límite geográfico de mi comuna
      description: "Para cualquier usuario de una comuna (no el superadmin). La comuna\
        \ sale del token. Devuelve la figura GeoJSON (Polygon o MultiPolygon) para\
        \ dibujarla en el mapa, o 204 si la comuna no tiene límite cargado."
      operationId: limiteDeMiComuna
      responses:
        "200":
          description: La figura GeoJSON del límite
          content:
            application/json:
              schema:
                type: object
        "204":
          description: La comuna no tiene límite cargado
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/ubicacion/direccion:
    get:
      tags:
      - Reclamos
      summary: Dirección aproximada de un punto
      description: "Para cualquier usuario de una comuna (no el superadmin). El backend\
        \ la pide a Nominatim (OpenStreetMap), respetando su política de uso: como\
        \ mucho un pedido por segundo, identificándose con el nombre de la app y guardando\
        \ las direcciones ya pedidas. El celular del vecino no se conecta con el servicio\
        \ externo. Es solo informativa: si el servicio no responde o no encuentra nada,\
        \ responde 204 y el reclamo sigue sin dirección. Servicio público para uso moderado:\
        \ alcanza para desarrollo y demostración; en producción conviene un proveedor\
        \ contratado o un servidor propio."
      operationId: direccionDeUnPunto
      parameters:
      - name: latitud
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: longitud
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      responses:
        "200":
          description: Dirección encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DireccionDto"
        "204":
          description: "No hay dirección para ese punto, o el servicio externo no respondió\
            \ a tiempo"
        "400":
          description: Latitud o longitud faltantes o fuera de rango (VALIDACION)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "429":
          description: "Se pidieron demasiadas direcciones seguidas (DEMASIADOS_PEDIDOS):\
            \ más de 10 por minuto del mismo usuario (las que ya estaban guardadas no\
            \ cuentan), o no hay turno libre hacia Nominatim en ese momento (como mucho\
            \ un pedido por segundo en total; no se hace esperar). El frontend lo trata\
            \ como \"sin dirección\"."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/salud:
    get:
      tags:
      - Salud
      summary: Estado del backend
      operationId: estado
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/comunas/{slug}/logo:
    get:
      tags:
      - Comunas
      summary: Logo de una comuna
      description: Imagen PNG o JPEG. No requiere sesión.
      operationId: logo
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: La imagen en binario. Los navegadores la pueden guardar
            en caché hasta 5 minutos.
          headers:
            Cache-Control:
              description: "max-age=300, public"
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: La comuna no existe, está inactiva o no tiene logo
  /api/comunas/{slug}:
    get:
      tags:
      - Comunas
      summary: Datos públicos de una comuna
      description: "Sirve para armar la cabecera de las pantallas de ingreso y la\
        \ ayuda de contacto (llamar o escribir por WhatsApp) del inicio del vecino.\
        \ No requiere sesión."
      operationId: buscar
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComunaDto"
        "404":
          description: La comuna no existe o está inactiva
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
components:
  schemas:
    DireccionDto:
      type: object
      properties:
        direccion:
          type: string
          maxLength: 300
          description: "Dirección aproximada, por ejemplo \"Av. San Martín 120, Agua de Oro\""
    TipoReclamoDto:
      type: object
      properties:
        codigo:
          type: string
          enum:
          - BACHE
          - LUZ
          - BASURA
          - ARBOL
          - AGUA
          - OTRO
        nombre:
          type: string
          description: "Nombre para mostrar, por ejemplo \"Bache o calle rota\""
        consejoFoto:
          type: string
          description: Consejo para sacar la foto de este tipo de problema
    CrearReclamoForm:
      type: object
      required:
      - tipo
      - descripcion
      - latitud
      - longitud
      properties:
        tipo:
          type: string
          description: Código del tipo de problema (ver /api/tipos-reclamo)
          enum:
          - BACHE
          - LUZ
          - BASURA
          - ARBOL
          - AGUA
          - OTRO
        descripcion:
          type: string
          minLength: 1
          maxLength: 500
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Va junto con longitud. Se guardan 6 decimales.
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Va junto con latitud. Se guardan 6 decimales.
        referencia:
          type: string
          maxLength: 200
          description: "Opcional. Cómo encontrar el lugar, por ejemplo \"frente a\
            \ la panadería\""
        direccion:
          type: string
          maxLength: 300
          description: "Opcional. Dirección aproximada del punto, la que devolvió /api/ubicacion/direccion.\
            \ Es solo informativa: el servidor no la usa para validar nada."
        fotos:
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
    ReclamoCreadoDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numero:
          type: integer
          format: int32
          description: Número de seguimiento, correlativo dentro de la comuna
        tipo:
          type: string
        estado:
          type: string
          enum:
          - RECIBIDO
        cantidadFotos:
          type: integer
          format: int32
        creadoEn:
          type: string
          format: date-time
    EstadoReclamo:
      type: string
      description: "Recibido, asignado, en reparación, resuelto o descartado."
      enum:
      - RECIBIDO
      - ASIGNADO
      - EN_REPARACION
      - RESUELTO
      - DESCARTADO
    PaginaMisReclamosDto:
      type: object
      properties:
        reclamos:
          type: array
          items:
            $ref: "#/components/schemas/MiReclamoResumenDto"
        pagina:
          type: integer
          format: int32
        tamanio:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
          description: Cantidad total de reclamos del vecino en la comuna
    MiReclamoResumenDto:
      type: object
      description: Un reclamo del vecino, para la lista de su pantalla de inicio.
      properties:
        numero:
          type: integer
          format: int32
        tipo:
          type: string
          description: Código del tipo de problema
        tipoNombre:
          type: string
          description: "Nombre para mostrar, por ejemplo \"Bache o calle rota\""
        estado:
          $ref: "#/components/schemas/EstadoReclamo"
        descripcion:
          type: string
        direccion:
          type:
          - string
          - "null"
        creadoEn:
          type: string
          format: date-time
        estadoCambiadoEn:
          type: string
          format: date-time
          description: Fecha del último cambio de estado (al crearlo, la misma que creadoEn)
        idFotoPrincipal:
          type:
          - integer
          - "null"
          format: int64
          description: "La primera foto que subió el vecino, para la miniatura; vacío si no subió ninguna"
    MiReclamoDetalleDto:
      type: object
      properties:
        numero:
          type: integer
          format: int32
        tipo:
          type: string
        tipoNombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoReclamo"
        descripcion:
          type: string
        referencia:
          type:
          - string
          - "null"
        direccion:
          type:
          - string
          - "null"
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double
        creadoEn:
          type: string
          format: date-time
        fotos:
          type: array
          description: "Primero las del vecino y después las del trabajo, cada grupo\
            \ en su orden. Las del trabajo vienen solo si el estado es RESUELTO"
          items:
            $ref: "#/components/schemas/FotoReclamoDto"
        historial:
          type: array
          description: "Los cambios de estado, del más viejo al más nuevo. El primero es siempre RECIBIDO, con la fecha de creación"
          items:
            $ref: "#/components/schemas/CambioDeEstadoDto"
        descarte:
          oneOf:
          - $ref: "#/components/schemas/DescarteDto"
          - type: "null"
          description: Solo si el estado es DESCARTADO
        trabajoRealizado:
          type:
          - string
          - "null"
          description: "Lo que escribió el agente al resolverlo. Solo si el estado es RESUELTO"
    FotoReclamoDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "Para pedir la imagen a /api/reclamos/mios/{numero}/fotos/{id}"
        origen:
          type: string
          enum:
          - VECINO
          - TRABAJO
          description: "VECINO: las que subió al reportar. TRABAJO: las que sacó el agente al resolverlo"
        orden:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
    CambioDeEstadoDto:
      type: object
      properties:
        estado:
          $ref: "#/components/schemas/EstadoReclamo"
        fecha:
          type: string
          format: date-time
    DescarteDto:
      type: object
      properties:
        motivo:
          type: string
          enum:
          - DUPLICADO
          - NO_ES_DE_LA_COMUNA
          - NO_SE_PUEDE_ATENDER
          - OTRO
        observacion:
          type:
          - string
          - "null"
          description: Lo que escribió la comuna al descartarlo. Vacío con motivo DUPLICADO
        estadoOriginal:
          oneOf:
          - $ref: "#/components/schemas/EstadoReclamo"
          - type: "null"
          description: "Solo con motivo DUPLICADO: el estado actual del reclamo que sigue la comuna. No se informa su número ni ningún dato de otro vecino"
        historialOriginal:
          type: array
          description: "Solo con motivo DUPLICADO: los cambios de estado del reclamo que sigue la comuna (estado y fecha, sin reasignaciones), para mostrar su avance. Vacío en los demás motivos"
          items:
            $ref: "#/components/schemas/CambioDeEstadoDto"
    PaginaReclamosPanelDto:
      type: object
      properties:
        reclamos:
          type: array
          items:
            $ref: "#/components/schemas/ReclamoPanelDto"
        pagina:
          type: integer
          format: int32
        tamanio:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    ReclamoPanelDto:
      type: object
      description: Una fila de la lista del panel.
      properties:
        numero:
          type: integer
          format: int32
        tipo:
          type: string
        tipoNombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoReclamo"
        descripcion:
          type: string
        direccion:
          type:
          - string
          - "null"
        referencia:
          type:
          - string
          - "null"
        creadoEn:
          type: string
          format: date-time
        agente:
          oneOf:
          - $ref: "#/components/schemas/AgenteDto"
          - type: "null"
        numeroOriginal:
          type:
          - integer
          - "null"
          format: int32
          description: "Si se descartó por duplicado, el número del original"
        cantidadDuplicados:
          type: integer
          format: int32
          description: Cuántos reclamos están descartados como duplicados de este
    MapaReclamosDto:
      type: object
      properties:
        puntos:
          type: array
          items:
            $ref: "#/components/schemas/PuntoReclamoDto"
        recortado:
          type: boolean
          description: "true si había más de 1000 y se devolvieron solo los 1000 más nuevos"
    PuntoReclamoDto:
      type: object
      properties:
        numero:
          type: integer
          format: int32
        estado:
          $ref: "#/components/schemas/EstadoReclamo"
        tipo:
          type: string
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double
    ResumenPanelDto:
      type: object
      properties:
        porEstado:
          type: object
          description: "Cantidad de reclamos en cada estado (los cinco, con 0 si no hay)"
          properties:
            RECIBIDO:
              type: integer
              format: int64
            ASIGNADO:
              type: integer
              format: int64
            EN_REPARACION:
              type: integer
              format: int64
            RESUELTO:
              type: integer
              format: int64
            DESCARTADO:
              type: integer
              format: int64
        total:
          type: integer
          format: int64
        sinAsignar:
          type: integer
          format: int64
          description: Reclamos en RECIBIDO de la comuna, sin filtros
        sinAsignarMasAntiguo:
          type:
          - string
          - "null"
          format: date-time
          description: Fecha de creación del reclamo sin asignar más viejo
    AgenteDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
    ReclamoPanelDetalleDto:
      type: object
      properties:
        numero:
          type: integer
          format: int32
        tipo:
          type: string
        tipoNombre:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoReclamo"
        descripcion:
          type: string
        referencia:
          type:
          - string
          - "null"
        direccion:
          type:
          - string
          - "null"
        latitud:
          type:
          - number
