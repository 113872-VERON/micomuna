          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclamoPanelDetalleDto"
        "400":
          description: "Falta el agente (VALIDACION) o no es un agente activo de la comuna\
            \ que aceptó la invitación (AGENTE_INVALIDO)"
          content:
