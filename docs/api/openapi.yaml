          - ADMINISTRATIVO
          - AGENTE
          - ADMIN_COMUNA
        activo:
          type: boolean
        correo:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Solo para usuarios PENDIENTE (sin contraseña).
    Problema:
      type: object
