      description: "Personal administrativo y administrador de la comuna. Si el reclamo\
        \ está RECIBIDO pasa a ASIGNADO con ese agente. Si ya tiene otro agente (ASIGNADO\
        \ o EN_REPARACION), se reasigna y queda ASIGNADO: el agente nuevo todavía\
        \ no empezó. Cada asignación o reasignación agrega una fila al historial con\
        \ quién la hizo y el agente (y el anterior, si es una reasignación). El agente\
        \ tiene que ser un AGENTE activo de la comuna que ya aceptó la invitación.\
        \ Devuelve el detalle actualizado."
      operationId: asignarAgente
