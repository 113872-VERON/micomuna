openapi: 3.1.0
info:
  title: MiComuna API
  description: Gestor de reclamos municipales
  version: 0.0.1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Comunas
  description: Consulta pública de una comuna por su enlace
- name: Administración
  description: "Acceso del superadmin de la plataforma, que no pertenece a ninguna\
    \ comuna"
- name: Mi cuenta
  description: "Acciones de quien ya inició sesión, sea cual sea su rol"
- name: Autenticación
  description: Registro e inicio de sesión de los usuarios de una comuna
- name: Usuarios de la comuna
  description: El administrador de la comuna gestiona a los usuarios de su comuna
- name: Reclamos
  description: Reclamos de los vecinos de una comuna
- name: Salud
  description: Comprobación de que el backend responde
paths:
  /api/comunas/{slug}/restablecer-clave:
    post:
      tags:
      - Autenticación
      summary: Elegir una contraseña nueva con el código del correo
      description: "El código sirve una sola vez. Un código inexistente, vencido,\
        \ usado o de otra comuna responde lo mismo: 400 CODIGO_INVALIDO."
      operationId: restablecerClave
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerClaveRequest"
        required: true
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: Datos inválidos o código inválido (CODIGO_INVALIDO)
        "404":
          description: La comuna no existe o está inactiva
  /api/comunas/{slug}/registro:
    post:
      tags:
      - Autenticación
      summary: Registrar un vecino
      description: Crea una cuenta de vecino en la comuna y devuelve el token para
        seguir con la sesión iniciada. El rol siempre es VECINO.
      operationId: registrar
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroRequest"
        required: true
      responses:
        "400":
          description: Datos inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: La comuna no existe o está inactiva
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Ese correo ya está registrado en la comuna
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthRespuesta"
  /api/comunas/{slug}/recuperar-clave:
    post:
      tags:
      - Autenticación
      summary: Pedir el correo para recuperar la contraseña
      description: "Responde siempre 202, exista o no la cuenta, para no revelar qué\
        \ correos están registrados. Si la cuenta existe y está activa, le llega un\
        \ enlace de un solo uso que vence en 60 minutos. Quien todavía no eligió su\
        \ contraseña recibe una invitación nueva."
      operationId: recuperarClave
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecuperarClaveRequest"
        required: true
      responses:
        "202":
          description: Pedido recibido
        "400":
          description: Correo inválido
        "404":
          description: La comuna no existe o está inactiva
  /api/comunas/{slug}/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión en una comuna
      description: "Devuelve el token y los datos del usuario. Cualquier falla de\
        \ credenciales responde lo mismo: 401 «Credenciales incorrectas». El superadmin\
        \ no entra por acá."
      operationId: iniciarSesion
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "400":
          description: Datos inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: Credenciales incorrectas
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: La comuna no existe o está inactiva
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/comunas/{slug}/aceptar-invitacion:
    post:
      tags:
      - Autenticación
      summary: Aceptar una invitación eligiendo la contraseña
      description: Con el código del correo de invitación (vence en 72 horas y sirve
        una vez). Después la persona ingresa por el login normal.
      operationId: aceptarInvitacion
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerClaveRequest"
        required: true
      responses:
        "204":
          description: Contraseña elegida
        "400":
          description: Datos inválidos o código inválido (CODIGO_INVALIDO)
        "404":
          description: La comuna no existe o está inactiva
  /api/auth/cambiar-clave:
    post:
      tags:
      - Mi cuenta
      summary: Cambiar mi contraseña
      description: Cambia la contraseña de quien tiene la sesión iniciada. Los tokens
        ya emitidos siguen valiendo hasta que venzan.
      operationId: cambiarClave
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarClaveRequest"
        required: true
      responses:
        "204":
          description: Contraseña cambiada
        "400":
          description: "La contraseña actual no es correcta, la nueva no cumple las\
            \ reglas o es igual a la actual"
        "401":
          description: Sin sesión
      security:
      - bearerAuth: []
  /api/admin/login:
    post:
      tags:
      - Administración
      summary: Iniciar sesión como superadmin
      description: Solo el superadmin entra por acá. Cualquier falla de credenciales
        responde 401 «Credenciales incorrectas».
      operationId: iniciarSesion_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "400":
          description: Datos inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: Credenciales incorrectas
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
  /api/admin/comunas:
    get:
      tags:
      - Administración
      summary: Listar todas las comunas
      description: Incluye las inactivas. No trae la imagen del logo.
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComunaAdminDto"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
      security:
      - bearerAuth: []
    post:
      tags:
      - Administración
      summary: Crear una comuna con su administrador
      description: "Crea la comuna y a su administrador, sin contraseña: elige la\
        \ suya con la invitación por correo. Si no se manda el enlace, se arma con\
        \ el nombre y la provincia. Las comunas no se borran, solo se desactivan."
      operationId: crear
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearComunaRequest"
        required: true
      responses:
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "400":
          description: Datos inválidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Ya existe una comuna con ese enlace
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaCreadaDto"
      security:
      - bearerAuth: []
  /api/admin/comunas/{id}/administrador/reenviar-invitacion:
    post:
      tags:
      - Administración
      summary: Reenviar la invitación al administrador de una comuna
      description: Para cuando el correo no salió o se perdió. Genera un enlace nuevo
        y deja sin efecto el anterior. Si el correo no sale responde 502 CORREO_NO_ENVIADO.
      operationId: reenviarInvitacion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
        "404":
          description: La comuna no existe
        "409":
          description: El administrador ya eligió su contraseña
        "502":
          description: El correo no pudo enviarse
        "204":
          description: No Content
      security:
      - bearerAuth: []
  /api/admin/comunas/{id}/logo:
    put:
      tags:
      - Administración
      summary: Subir o reemplazar el logo de una comuna
      description: Formulario multipart con el archivo en el campo "archivo". Solo
        PNG o JPEG de hasta 512 KB y 2000 x 2000 píxeles; el tipo se decide por el
        contenido del archivo y la imagen se decodifica para comprobar que es válida.
        No se acepta SVG.
      operationId: cambiarLogo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
              required:
              - archivo
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComunaAdminDto"
        "400":
          description: "El archivo está vacío, pesa más de 512 KB, no es una imagen\
            \ PNG o JPEG válida o supera los 2000 px de ancho o alto (LOGO_INVALIDO).\
            \ Falta la parte \"archivo\" (PETICION_INVALIDA). La subida supera el tope\
            \ del servidor (ARCHIVO_MUY_GRANDE)."
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
        "404":
          description: La comuna no existe
      security:
      - bearerAuth: []
  /api/admin/comunas/{id}:
    patch:
      tags:
      - Administración
      summary: Cambiar una comuna
      description: "Cambio parcial de nombre, color, departamento, teléfono, WhatsApp\
        \ y activa. El enlace y la provincia no se pueden cambiar. Desactivarla impide\
        \ el ingreso de sus usuarios y su consulta pública. Cualquier cambio actualiza\
        \ actualizadaEn (también subir el logo o el límite)."
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarComunaRequest"
        required: true
      responses:
        "200":
          description: Comuna actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComunaAdminDto"
        "400":
          description: "Datos inválidos (VALIDACION, con el motivo de cada campo en\
            \ errores), por ejemplo un teléfono con letras o un nombre vacío"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: La comuna no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
      security:
      - bearerAuth: []
  /api/usuarios:
    get:
      tags:
      - Usuarios de la comuna
      summary: Listar los usuarios de mi comuna
      description: "Solo el administrador de la comuna. Devuelve todos los usuarios\
        \ de la comuna del token (vecinos y personal), ordenados por nombre. La comuna\
        \ sale siempre del token, nunca de un parámetro."
      operationId: listarUsuarios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioComunaDto"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
    post:
      tags:
      - Usuarios de la comuna
      summary: Dar de alta a una persona del personal
      description: "Solo el administrador de la comuna. Crea al usuario en la comuna\
        \ del token, sin contraseña (queda PENDIENTE), y le manda una invitación por\
        \ correo para que elija la suya. Los vecinos no se dan de alta por acá: se\
        \ registran solos. Si el correo no sale, el usuario igual queda creado y la\
        \ respuesta trae invitacionEnviada = false."
      operationId: crearUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearUsuarioRequest"
        required: true
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreadoDto"
        "400":
          description: "Datos inválidos (VALIDACION) o rol VECINO o SUPERADMIN, que\
            \ no se dan de alta por acá (ROL_NO_PERMITIDO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: Ya hay un usuario con ese correo en la comuna (CONFLICTO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/usuarios/{id}:
    patch:
      tags:
      - Usuarios de la comuna
      summary: Cambiar el rol, el estado o el correo de un usuario
      description: "Solo el administrador de la comuna. Cambio parcial: se manda solo\
        \ lo que cambia. El rol puede ser cualquiera menos SUPERADMIN. Desactivar\
        \ no borra: el usuario no puede iniciar sesión hasta que se lo reactive. El\
        \ correo solo se puede corregir mientras el usuario está PENDIENTE; al corregirlo\
        \ la invitación anterior queda sin efecto y hay que reenviarla. Un administrador\
        \ no puede desactivarse ni quitarse el rol a sí mismo, ni dejar a la comuna\
        \ sin administradores activos (409). Un usuario de otra comuna responde 404,\
        \ igual que uno inexistente."
      operationId: actualizarUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarUsuarioRequest"
        required: true
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioComunaDto"
        "400":
          description: "Datos inválidos (VALIDACION), pedido sin ningún campo (PEDIDO_VACIO)\
            \ o rol SUPERADMIN (ROL_NO_PERMITIDO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: El usuario no existe o es de otra comuna (NO_ENCONTRADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: "Cambio sobre uno mismo, la comuna quedaría sin administradores\
            \ activos, correo de un usuario que ya no está pendiente, correo ya usado\
            \ en la comuna u otra persona está cambiando estos datos (CONFLICTO, con\
            \ el motivo en detail)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/usuarios/{id}/reenviar-invitacion:
    post:
      tags:
      - Usuarios de la comuna
      summary: Reenviar la invitación a un usuario pendiente
      description: "Solo el administrador de la comuna. Genera un enlace nuevo y deja\
        \ sin efecto el anterior. Si el correo no sale responde 502 CORREO_NO_ENVIADO."
      operationId: reenviarInvitacionUsuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Invitación enviada
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: El usuario no existe o es de otra comuna (NO_ENCONTRADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: "El usuario ya eligió su contraseña, está inactivo u otra persona\
            \ está cambiando estos datos (CONFLICTO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "502":
          description: El correo no pudo enviarse (CORREO_NO_ENVIADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/tipos-reclamo:
    get:
      tags:
      - Reclamos
      summary: Tipos de problema
      description: "Los seis tipos de problema, iguales para todas las comunas, en\
        \ el orden en que se muestran, con el consejo para sacar la foto de cada uno.\
        \ Para cualquier usuario de una comuna (no el superadmin)."
      operationId: listarTiposReclamo
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoReclamoDto"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/reclamos:
    post:
      tags:
      - Reclamos
      summary: Reportar un problema
      description: "Solo el vecino. Crea el reclamo en la comuna del token (nunca\
        \ de lo que manda el cliente) con estado RECIBIDO y el número de seguimiento\
        \ que le toca en esa comuna (correlativo, cada comuna empieza en 1). Formulario\
        \ multipart. Latitud y longitud son obligatorias (el punto del mapa o del GPS);\
        \ la referencia escrita y la dirección aproximada son opcionales. Si la comuna\
        \ tiene un límite cargado, el punto tiene que estar adentro (un punto sobre\
        \ el borde cuenta como adentro); si no tiene límite, no hay restricción. Hasta\
        \ 3 fotos opcionales en el campo \"fotos\": cada una tiene que ser un JPG o\
        \ PNG real (se decide por el contenido, no por lo que declara el cliente),\
        \ de hasta 2 MB y hasta 2560 px de lado. El servidor vuelve a armar cada foto\
        \ y no guarda sus datos ocultos (por ejemplo la ubicación GPS de la cámara).\
        \ Cada vecino puede crear hasta 10 reclamos por hora."
      operationId: crearReclamo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CrearReclamoForm"
            encoding:
              fotos:
                contentType: "image/jpeg, image/png"
      responses:
        "201":
          description: Reclamo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclamoCreadoDto"
        "400":
          description: "Datos inválidos (VALIDACION, con el motivo de cada campo en\
            \ errores), tipo de problema inexistente (TIPO_INVALIDO), faltan latitud\
            \ y longitud (UBICACION_REQUERIDA), el punto está fuera de la comuna (FUERA_DE_COMUNA),\
            \ más de 3 fotos o una foto que no es un JPG o PNG\
            \ real, pesa más de 2 MB, supera los 2560 px, ocuparía demasiada memoria\
            \ al abrirla o pesaría más de 3 MB una vez limpia (FOTO_INVALIDA), o el pedido\
            \ supera el tope de subida del servidor (ARCHIVO_MUY_GRANDE)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: "Otra persona está reportando en este momento y no se pudo\
            \ asignar el número (CONFLICTO). Probá de nuevo."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "429":
          description: "El vecino ya creó 10 reclamos en la última hora (DEMASIADOS_RECLAMOS).\
            \ Puede volver a intentar más tarde."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "503":
          description: "El servidor está procesando muchas fotos a la vez (OCUPADO).\
            \ Probá de nuevo en unos segundos."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/admin/comunas/{id}/limite:
    put:
      tags:
      - Administración
      summary: Cargar o reemplazar el límite geográfico de una comuna
      description: "Solo el superadmin. El cuerpo es el contenido del archivo GeoJSON.\
        \ Se acepta un Polygon o un MultiPolygon, solo o dentro de un Feature o de\
        \ un FeatureCollection con una sola figura. Las coordenadas van en grados (longitud,\
        \ latitud), como manda GeoJSON. Hasta 1 MB. Se guarda solo la figura, sin las\
        \ propiedades del archivo."
      operationId: cambiarLimite
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GeoJSON (Polygon, MultiPolygon, Feature o FeatureCollection)
      responses:
        "200":
          description: Límite guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComunaAdminDto"
        "400":
          description: "El archivo no es un GeoJSON válido, no tiene un polígono, tiene\
            \ más de una figura, coordenadas fuera de rango o un polígono que se corta\
            \ a sí mismo (LIMITE_INVALIDO), o pesa más de 1 MB"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "404":
          description: La comuna no existe (NO_ENCONTRADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/mi-comuna/limite:
    get:
      tags:
      - Reclamos
      summary: Límite geográfico de mi comuna
      description: "Para cualquier usuario de una comuna (no el superadmin). La comuna\
        \ sale del token. Devuelve la figura GeoJSON (Polygon o MultiPolygon) para\
        \ dibujarla en el mapa, o 204 si la comuna no tiene límite cargado."
      operationId: limiteDeMiComuna
      responses:
        "200":
          description: La figura GeoJSON del límite
          content:
            application/json:
              schema:
                type: object
        "204":
          description: La comuna no tiene límite cargado
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/ubicacion/direccion:
    get:
      tags:
      - Reclamos
      summary: Dirección aproximada de un punto
      description: "Para cualquier usuario de una comuna (no el superadmin). El backend\
        \ la pide a Nominatim (OpenStreetMap), respetando su política de uso: como\
        \ mucho un pedido por segundo, identificándose con el nombre de la app y guardando\
        \ las direcciones ya pedidas. El celular del vecino no se conecta con el servicio\
        \ externo. Es solo informativa: si el servicio no responde o no encuentra nada,\
        \ responde 204 y el reclamo sigue sin dirección. Servicio público para uso moderado:\
        \ alcanza para desarrollo y demostración; en producción conviene un proveedor\
        \ contratado o un servidor propio."
      operationId: direccionDeUnPunto
      parameters:
      - name: latitud
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
      - name: longitud
        in: query
        required: true
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
      responses:
        "200":
          description: Dirección encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DireccionDto"
        "204":
          description: "No hay dirección para ese punto, o el servicio externo no respondió\
            \ a tiempo"
        "400":
          description: Latitud o longitud faltantes o fuera de rango (VALIDACION)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "429":
          description: "Se pidieron demasiadas direcciones seguidas (DEMASIADOS_PEDIDOS):\
            \ más de 10 por minuto del mismo usuario (las que ya estaban guardadas no\
            \ cuentan), o no hay turno libre hacia Nominatim en ese momento (como mucho\
            \ un pedido por segundo en total; no se hace esperar). El frontend lo trata\
            \ como \"sin dirección\"."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/salud:
    get:
      tags:
      - Salud
      summary: Estado del backend
      operationId: estado
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/comunas/{slug}/logo:
    get:
      tags:
      - Comunas
      summary: Logo de una comuna
      description: Imagen PNG o JPEG. No requiere sesión.
      operationId: logo
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: La imagen en binario. Los navegadores la pueden guardar
            en caché hasta 5 minutos.
          headers:
            Cache-Control:
              description: "max-age=300, public"
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: La comuna no existe, está inactiva o no tiene logo
  /api/comunas/{slug}:
    get:
      tags:
      - Comunas
      summary: Datos públicos de una comuna
      description: Sirve para armar la cabecera de las pantallas de ingreso. No requiere
        sesión.
      operationId: buscar
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: La comuna no existe o está inactiva
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
components:
  schemas:
    DireccionDto:
      type: object
      properties:
        direccion:
          type: string
          maxLength: 300
          description: "Dirección aproximada, por ejemplo \"Av. San Martín 120, Agua de Oro\""
    TipoReclamoDto:
      type: object
      properties:
        codigo:
          type: string
          enum:
          - BACHE
          - LUZ
          - BASURA
          - ARBOL
          - AGUA
          - OTRO
        nombre:
          type: string
          description: "Nombre para mostrar, por ejemplo \"Bache o calle rota\""
        consejoFoto:
          type: string
          description: Consejo para sacar la foto de este tipo de problema
    CrearReclamoForm:
      type: object
      required:
      - tipo
      - descripcion
      - latitud
      - longitud
      properties:
        tipo:
          type: string
          description: Código del tipo de problema (ver /api/tipos-reclamo)
          enum:
          - BACHE
          - LUZ
          - BASURA
          - ARBOL
          - AGUA
          - OTRO
        descripcion:
          type: string
          minLength: 1
          maxLength: 500
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Va junto con longitud. Se guardan 6 decimales.
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Va junto con latitud. Se guardan 6 decimales.
        referencia:
          type: string
          maxLength: 200
          description: "Opcional. Cómo encontrar el lugar, por ejemplo \"frente a\
            \ la panadería\""
        direccion:
          type: string
          maxLength: 300
          description: "Opcional. Dirección aproximada del punto, la que devolvió /api/ubicacion/direccion.\
            \ Es solo informativa: el servidor no la usa para validar nada."
        fotos:
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
    ReclamoCreadoDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numero:
          type: integer
          format: int32
          description: Número de seguimiento, correlativo dentro de la comuna
        tipo:
          type: string
        estado:
          type: string
          enum:
          - RECIBIDO
        cantidadFotos:
          type: integer
          format: int32
        creadoEn:
          type: string
          format: date-time
    UsuarioComunaDto:
      type: object
      description: Un usuario de la comuna, para el panel del administrador. Nunca trae la clave.
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        correo:
          type: string
        rol:
          type: string
          enum:
          - VECINO
          - ADMINISTRATIVO
          - AGENTE
          - ADMIN_COMUNA
        estado:
          type: string
          description: "PENDIENTE: todavía no eligió su contraseña. INACTIVO: desactivado\
            \ por el administrador (tiene prioridad sobre PENDIENTE). ACTIVO: el resto."
          enum:
          - ACTIVO
          - INACTIVO
          - PENDIENTE
        creadoEn:
          type: string
          format: date-time
    CrearUsuarioRequest:
      type: object
      required:
      - nombre
      - correo
      - rol
      properties:
        nombre:
          type: string
          maxLength: 100
        correo:
          type: string
          format: email
          maxLength: 254
        rol:
          type: string
          description: Solo personal. Los vecinos se registran solos.
          enum:
          - ADMINISTRATIVO
          - AGENTE
          - ADMIN_COMUNA
    UsuarioCreadoDto:
      type: object
      description: invitacionEnviada = false significa que el usuario se creó pero el correo no salió (se puede reenviar).
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioComunaDto"
        invitacionEnviada:
          type: boolean
    ActualizarUsuarioRequest:
      type: object
      description: Cambio parcial. Al menos un campo.
      properties:
        rol:
          type: string
          enum:
          - VECINO
          - ADMINISTRATIVO
          - AGENTE
          - ADMIN_COMUNA
        activo:
          type: boolean
        correo:
          type: string
          format: email
          minLength: 1
          maxLength: 254
          description: Solo para usuarios PENDIENTE (sin contraseña).
    Problema:
      type: object
      description: Respuesta de error (RFC 9457). El campo codigo identifica el error para el frontend.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
          description: Mensaje para mostrar al usuario
        instance:
          type: string
        codigo:
          type: string
          description: "Por ejemplo ACCESO_DENEGADO, NO_ENCONTRADO, VALIDACION, LOGO_INVALIDO"
        errores:
          type: object
          description: "Solo en VALIDACION: el motivo de cada campo inválido, con\
            \ el nombre del campo como clave"
          additionalProperties:
            type: string
    RestablecerClaveRequest:
      type: object
      properties:
        codigo:
          type: string
          description: Código que vino en el enlace del correo
          maxLength: 100
          minLength: 0
        claveNueva:
          type: string
          format: password
          description: De 8 a 72 caracteres
      required:
      - codigo
    RegistroRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          minLength: 0
        correo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        clave:
          type: string
          format: password
          description: De 8 a 72 caracteres
      required:
      - correo
      - nombre
    AuthRespuesta:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/UsuarioDto"
    UsuarioDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        correo:
          type: string
        rol:
          type: string
          enum:
          - VECINO
          - ADMINISTRATIVO
          - AGENTE
          - ADMIN_COMUNA
          - SUPERADMIN
        comunaSlug:
          type: string
    RecuperarClaveRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          minLength: 1
      required:
      - correo
    LoginRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        clave:
          type: string
          format: password
          maxLength: 200
          minLength: 0
      required:
      - clave
      - correo
    CambiarClaveRequest:
      type: object
      properties:
        claveActual:
          type: string
          format: password
          minLength: 1
        claveNueva:
          type: string
          format: password
          description: "De 8 a 72 caracteres, distinta de la actual"
      required:
      - claveActual
    CrearComunaRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          minLength: 0
        provincia:
          type: string
          enum:
          - BUENOS_AIRES
          - CABA
          - CATAMARCA
          - CHACO
          - CHUBUT
          - CORDOBA
          - CORRIENTES
          - ENTRE_RIOS
          - FORMOSA
          - JUJUY
          - LA_PAMPA
          - LA_RIOJA
          - MENDOZA
          - MISIONES
          - NEUQUEN
          - RIO_NEGRO
          - SALTA
          - SAN_JUAN
          - SAN_LUIS
          - SANTA_CRUZ
          - SANTA_FE
          - SANTIAGO_DEL_ESTERO
          - TIERRA_DEL_FUEGO
          - TUCUMAN
        slug:
          type: string
          description: "Enlace de la comuna. Si falta, se arma con el nombre y la\
            \ provincia (salsipuedes-cordoba). No se puede cambiar después."
          maxLength: 120
          minLength: 0
          pattern: "[a-z0-9]+(-[a-z0-9]+)*"
        color:
          type: string
          description: "Color de la paleta. Si falta, CELESTE."
          enum:
          - CELESTE
          - MARINO
          - VERDE_AZULADO
          - BOSQUE
          - CIRUELA
          - OCRE
          - PIZARRA
        departamento:
          type: string
          maxLength: 80
          minLength: 0
        telefono:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos."
        whatsapp:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos."
        adminCorreo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        adminNombre:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - adminCorreo
      - adminNombre
      - nombre
      - provincia
    ComunaAdminDto:
      type: object
      properties:
        telefono:
          type: string
        whatsapp:
          type: string
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
          description: Última modificación de la comuna (datos, logo, límite o estado)
        id:
          type: integer
          format: int64
        nombre:
          type: string
        provincia:
          type: string
        slug:
          type: string
        activa:
          type: boolean
        color:
          type: string
        departamento:
          type: string
        tieneLogo:
          type: boolean
        tieneLimite:
          type: boolean
          description: "Si la comuna tiene cargado su límite geográfico. Sin límite,\
            \ los vecinos pueden reportar desde cualquier lugar."
        limiteCargadoEn:
          type: string
          format: date-time
          description: Cuándo se cargó el límite (vacío si no tiene)
    ComunaCreadaDto:
      type: object
      properties:
        comuna:
          $ref: "#/components/schemas/ComunaAdminDto"
        adminCorreo:
          type: string
        invitacionEnviada:
          type: boolean
    ActualizarComunaRequest:
      type: object
      properties:
        telefono:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos. Un texto vacío lo borra; si no viene, no se toca."
        whatsapp:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos. Un texto vacío lo borra; si no viene, no se toca."
        nombre:
          type: string
          maxLength: 100
          minLength: 1
        activa:
          type: boolean
        color:
          type: string
          enum:
          - CELESTE
          - MARINO
          - VERDE_AZULADO
          - BOSQUE
          - CIRUELA
          - OCRE
          - PIZARRA
        departamento:
          type: string
          description: Un texto vacío borra el departamento.
          maxLength: 80
          minLength: 0
    ComunaDto:
      type: object
      properties:
        nombre:
          type: string
        provincia:
          type: string
        departamento:
          type: string
        slug:
          type: string
        tieneLogo:
          type: boolean
        color:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
