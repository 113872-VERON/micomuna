          type: string
          format: password
          description: "De 8 a 72 caracteres, distinta de la actual"
      required:
      - claveActual
    CrearComunaRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 100
          minLength: 0
        provincia:
          type: string
          enum:
          - BUENOS_AIRES
          - CABA
          - CATAMARCA
          - CHACO
          - CHUBUT
          - CORDOBA
          - CORRIENTES
          - ENTRE_RIOS
          - FORMOSA
          - JUJUY
          - LA_PAMPA
          - LA_RIOJA
          - MENDOZA
          - MISIONES
          - NEUQUEN
          - RIO_NEGRO
          - SALTA
          - SAN_JUAN
          - SAN_LUIS
          - SANTA_CRUZ
          - SANTA_FE
          - SANTIAGO_DEL_ESTERO
          - TIERRA_DEL_FUEGO
          - TUCUMAN
        slug:
          type: string
          description: "Enlace de la comuna. Si falta, se arma con el nombre y la\
            \ provincia (salsipuedes-cordoba). No se puede cambiar después."
          maxLength: 120
          minLength: 0
          pattern: "[a-z0-9]+(-[a-z0-9]+)*"
        color:
          type: string
          description: "Color de la paleta. Si falta, CELESTE."
          enum:
          - CELESTE
          - MARINO
          - VERDE_AZULADO
          - BOSQUE
          - CIRUELA
          - OCRE
          - PIZARRA
        departamento:
          type: string
          maxLength: 80
          minLength: 0
        telefono:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos."
        whatsapp:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos."
        adminCorreo:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        adminNombre:
          type: string
          maxLength: 100
          minLength: 0
      required:
      - adminCorreo
      - adminNombre
      - nombre
      - provincia
    ComunaAdminDto:
      type: object
      properties:
        telefono:
          type: string
        whatsapp:
          type: string
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
          description: Última modificación de la comuna (datos, logo, límite o estado)
        id:
          type: integer
          format: int64
        nombre:
          type: string
        provincia:
          type: string
        slug:
          type: string
        activa:
          type: boolean
        color:
          type: string
        departamento:
          type: string
        tieneLogo:
          type: boolean
        tieneLimite:
          type: boolean
          description: "Si la comuna tiene cargado su límite geográfico. Sin límite,\
            \ los vecinos pueden reportar desde cualquier lugar."
        limiteCargadoEn:
          type: string
          format: date-time
          description: Cuándo se cargó el límite (vacío si no tiene)
    ComunaCreadaDto:
      type: object
      properties:
        comuna:
          $ref: "#/components/schemas/ComunaAdminDto"
        adminCorreo:
          type: string
        invitacionEnviada:
          type: boolean
    ActualizarComunaRequest:
      type: object
      properties:
        telefono:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos. Un texto vacío lo borra; si no viene, no se toca."
        whatsapp:
          type: string
          description: "Opcional. Número argentino con código de país 54, sin el 0 ni el 15 (por ejemplo 5493543123456). Se aceptan espacios, guiones, paréntesis y un + inicial, que el servidor quita; después tiene que quedar 54 seguido de 10 u 11 dígitos. Un texto vacío lo borra; si no viene, no se toca."
        nombre:
          type: string
          maxLength: 100
          minLength: 1
        activa:
          type: boolean
        color:
          type: string
          enum:
          - CELESTE
          - MARINO
          - VERDE_AZULADO
          - BOSQUE
          - CIRUELA
          - OCRE
          - PIZARRA
        departamento:
          type: string
          description: Un texto vacío borra el departamento.
          maxLength: 80
          minLength: 0
    ComunaDto:
      type: object
      properties:
        nombre:
          type: string
        provincia:
          type: string
        departamento:
          type: string
        slug:
          type: string
        tieneLogo:
          type: boolean
        color:
          type: string
        telefono:
          type:
          - string
          - "null"
          description: "Teléfono de contacto de la comuna, solo dígitos con código 54 (por ejemplo 543543123456). Vacío si no lo cargó"
        whatsapp:
          type:
          - string
          - "null"
          description: "WhatsApp de la comuna, solo dígitos con código 54, listo para armar el enlace wa.me. Vacío si no lo cargó"
  parameters:
    FiltroEstado:
      name: estado
      in: query
      required: false
      description: Solo reclamos en este estado
      schema:
        $ref: "#/components/schemas/EstadoReclamo"
    FiltroTipo:
      name: tipo
      in: query
      required: false
      description: Código del tipo de problema
      schema:
        type: string
        enum:
        - BACHE
        - LUZ
        - BASURA
        - ARBOL
        - AGUA
        - OTRO
    FiltroAgente:
      name: agente
      in: query
      required: false
      description: "Id del agente asignado. Un agente de otra comuna no da error: no encuentra nada"
      schema:
        type: integer
        format: int64
    FiltroBuscar:
      name: buscar
      in: query
      required: false
      description: "Un número (busca ese número de reclamo) o un texto de 2 a 100 caracteres\
        \ (busca en la dirección y la referencia, sin distinguir mayúsculas ni tildes)"
      schema:
        type: string
        maxLength: 100
    NumeroReclamo:
      name: numero
      in: path
      required: true
      description: Número del reclamo dentro de la comuna
      schema:
        type: integer
        format: int32
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
