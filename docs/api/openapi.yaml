              schema:
                $ref: "#/components/schemas/Problema"
        "409":
          description: "El reclamo está RESUELTO o DESCARTADO (RECLAMO_CERRADO), ya está\
            \ asignado a ese mismo agente (YA_ASIGNADO), u otra persona lo está cambiando\
            \ en este momento (CONFLICTO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/panel/reclamos/cambios-de-estado:
    post:
      tags:
      - Panel de reclamos
      summary: Cambiar el estado de uno o varios reclamos
      description: "Personal administrativo y administrador de la comuna. Aplica el\
        \ mismo estado a cada reclamo de la lista, de a uno y por separado: los que\
        \ se pueden cambiar se cambian y los demás se informan en omitidos con el\
        \ motivo, sin frenar al resto. Estados posibles: RECIBIDO, ASIGNADO (exige\
        \ idAgente, un agente activo de la comuna), EN_REPARACION y RESUELTO. Para\
        \ DESCARTADO está /descartes. Se respetan las reglas de cambio de estado (por\
        \ ejemplo, de RECIBIDO no se pasa directo a RESUELTO). Volver a RECIBIDO quita\
        \ el agente. Cada cambio queda en el historial con quién lo hizo. Un número\
        \ de otra comuna o inexistente sale en omitidos como NO_ENCONTRADO, igual\
        \ que uno que no existe. Si un reclamo falla por otro motivo sale en omitidos\
        \ (AGENTE_INVALIDO, ORIGINAL_INVALIDO o ERROR) y los ya cambiados quedan.\
        \ Tope de 30 segundos por lote: los que no se llegan a procesar salen como\
        \ CONFLICTO. Solo se puede asignar a agentes que ya aceptaron la invitación.\
        \ Correos (MC-22 y MC-23): cada cambio de estado (de cualquier endpoint, también\
        \ los del agente) le manda un correo al vecino después de guardarse, sin hacer\
        \ esperar al pedido; si el envío falla, el cambio queda y el error se registra\
        \ (sin reintentos). No avisan el alta ni una reasignación. Los vecinos de los\
        \ reclamos descartados como duplicado de este también reciben un aviso, sin\
        \ el número ni datos del original."
      operationId: cambiarEstadoDeReclamos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambioDeEstadoEnLoteRequest"
      responses:
        "200":
          description: "Resultado de cada reclamo: los cambiados y los omitidos con su motivo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoEnLoteDto"
        "400":
          description: "Pedido inválido (VALIDACION): lista vacía o de más de 100, números\
            \ repetidos, estado no permitido acá; ASIGNADO sin agente o agente que no\
            \ es un agente activo de la comuna (AGENTE_INVALIDO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
      security:
      - bearerAuth: []
  /api/panel/reclamos/descartes:
    post:
      tags:
      - Panel de reclamos
      summary: Descartar uno o varios reclamos
      description: "Personal administrativo y administrador de la comuna. Descarta\
        \ cada reclamo de la lista, de a uno y por separado, con el mismo motivo y\
        \ observación. La observación (hasta 300 caracteres) es obligatoria con los\
        \ demás motivos y el vecino la lee. Con motivo DUPLICADO no se escribe observación\
        \ (si viene, 400 VALIDACION, para que el vecino nunca vea el número del original)\
        \ y en cambio se exige numeroOriginal: un reclamo de la misma comuna, que\
        \ no esté descartado y que no esté en la lista. Los reclamos RESUELTO o DESCARTADO\
        \ no se descartan y salen en omitidos (YA_CERRADO). Cada descarte le manda\
        \ un correo al vecino después de guardarse (ver el detalle en la descripción\
        \ de cambios-de-estado)."
      operationId: descartarReclamos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescarteEnLoteRequest"
      responses:
        "200":
          description: "Resultado de cada reclamo: los descartados y los omitidos con su motivo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoEnLoteDto"
        "400":
          description: "Pedido inválido (VALIDACION): lista vacía o de más de 100, números\
            \ repetidos, falta el motivo (MOTIVO_REQUERIDO), falta la observación (OBSERVACION_REQUERIDA),\
            \ observación de más de 300 caracteres, DUPLICADO sin original (ORIGINAL_REQUERIDO)\
            \ o con un original inexistente, de otra comuna, descartado o incluido en\
            \ la lista (ORIGINAL_INVALIDO)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "401":
          description: "Sin sesión, o el token venció o no es válido"
        "403":
          description: Tu rol no permite esto (ACCESO_DENEGADO)
          content:
            application/problem+json:
