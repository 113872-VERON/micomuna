name: CI

# Se ejecuta en cada pull request hacia main y cuando se actualiza main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Si se sube un cambio nuevo mientras corre uno anterior de la misma rama, se cancela el viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compila
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      # Compila el código y las pruebas, y arma el paquete.
      # TODO (MC-9): cuando Oracle esté conectado, sacar -DskipTests para que también
      # se ejecuten las pruebas. Hoy MiComunaApplicationTests.contextLoads necesita una base de datos.
      - name: Compilar y empaquetar
        run: ./mvnw -B -ntp -DskipTests verify
