name: CI

# Se ejecuta en cada pull request hacia main y cuando se actualiza main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Si se sube un cambio nuevo mientras corre uno anterior de la misma rama, se cancela el viejo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend compila y prueba
    runs-on: ubuntu-latest
    # Base Oracle Free para las pruebas (el mismo motor que se usa en desarrollo).
    # Las claves son solo de prueba: el contenedor existe mientras corre el job.
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: ci_sys_password
          APP_USER: micomuna
          APP_USER_PASSWORD: ci_micomuna_password
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    env:
      ORACLE_PORT: 1521
      APP_USER: micomuna
      APP_USER_PASSWORD: ci_micomuna_password
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      # Compila, ejecuta las pruebas contra Oracle y arma el paquete.
      - name: Compilar, probar y empaquetar
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend compila y prueba
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test -- --watch=false
