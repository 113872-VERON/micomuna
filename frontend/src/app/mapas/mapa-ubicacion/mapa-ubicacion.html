<div class="mapa" [class.fijo]="!interactivo()" role="group" [attr.aria-label]="etiqueta()">
  <div #lienzo class="lienzo" [style.height]="altura()"></div>
  @if (mostrarCartel()) {
    <div class="chip" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v7M10 10.5V6a2 2 0 0 0-4 0v8l-1.5-1.5a2 2 0 0 0-3 2.6L6 21h9a5 5 0 0 0 5-5v-4a2 2 0 0 0-4 0" /></svg>
      Arrastrá el mapa
    </div>
  }
  <!-- La punta del pin queda justo en el centro: ese es el punto que se reporta. -->
  <div class="pin" aria-hidden="true">
    <svg viewBox="0 0 24 29" fill="none"><path d="M12 28s9-8 9-16A9 9 0 1 0 3 12c0 8 9 16 9 16z" fill="currentColor" stroke="#fff" stroke-width="2" /><circle cx="12" cy="12" r="3.6" fill="#fff" /></svg>
  </div>
</div>
