<div class="sello-grande" aria-hidden="true">
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
</div>
<h1 tabindex="-1">Recibimos tu reclamo</h1>

@if (b.creado(); as reclamo) {
  <div class="ticket">
    <p class="n">Reclamo n.º <b>{{ reclamo.numero }}</b></p>
    <span class="estado">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M3.5 7l8.5 6 8.5-6" /></svg>
      Recibido
    </span>
    @if (cuando(); as texto) {
      <p class="proximos">{{ texto }}</p>
    }
  </div>
}
<p class="proximos">La comuna lo va a revisar y a asignar.</p>

<div class="espacio"></div>
<a class="btn pri" routerLink="/inicio">Volver al inicio</a>
<button type="button" class="link otro" (click)="b.reiniciar()">Reportar otro problema</button>
