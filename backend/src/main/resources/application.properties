spring.application.name=micomuna

# Perfil por defecto: desarrollo local (ver application-dev.properties)
spring.profiles.default=dev

# El esquema lo manejan las migraciones de Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Tope de subida de archivos; el servidor corta antes de leer más. Por archivo: lo que pesa como mucho una foto
# de un reclamo (2 MB). Por pedido: las 3 fotos más los campos del formulario. Cada endpoint aplica además su
# propio límite (el logo de una comuna, 512 KB, lo revisa ComunaService).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=7MB
# Las fechas (Instant) viven en columnas TIMESTAMP y se guardan y leen en UTC.
# Sin esto Hibernate las lee como OffsetDateTime y el driver de Oracle falla con ORA-18716
# al cargar una fila desde la base (las pruebas no lo detectan porque reutilizan la entidad en memoria).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger solo en desarrollo (se activa en application-dev.properties)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT: el secreto viene de la variable de entorno JWT_SECRET (mínimo 32 caracteres, sin valor por defecto)
jwt.secret=${JWT_SECRET:}
jwt.expiracion=${JWT_EXPIRACION:4h}

# Direcciones aproximadas de un punto (GET /api/ubicacion/direccion): Nominatim, el buscador de OpenStreetMap.
# Servicio publico de uso moderado (alcanza para desarrollo y demostracion); la URL se puede cambiar por la de un servidor propio.
nominatim.url=https://nominatim.openstreetmap.org
# Opcional: correo de contacto que se agrega al User-Agent, como pide su politica de uso. Nunca se escribe en los registros.
nominatim.contacto=${NOMINATIM_CONTACTO:}

# Superadmin inicial: se crea al iniciar solo si no existe ninguno y las dos variables tienen valor
superadmin.correo=${SUPERADMIN_CORREO:}
superadmin.clave=${SUPERADMIN_CLAVE:}

# Correo: en desarrollo va a Mailpit (ver db/docker-compose.yml). En producción se pasan las variables MAIL_*.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CLAVE:}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.remitente=${MAIL_REMITENTE:no-responder@micomuna.local}
# Base de los enlaces que llegan por correo (la dirección del frontend)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Largo mínimo de la clave del superadmin inicial (en el perfil prod sube a 12)
superadmin.clave-minima=8
