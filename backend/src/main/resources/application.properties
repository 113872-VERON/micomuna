spring.application.name=micomuna

# Perfil por defecto: desarrollo local (ver application-dev.properties)
spring.profiles.default=dev

# El esquema lo manejan las migraciones de Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Swagger solo en desarrollo (se activa en application-dev.properties)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
