spring.application.name=micomuna

# Perfil por defecto: desarrollo local (ver application-dev.properties)
spring.profiles.default=dev

# El esquema lo manejan las migraciones de Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Tope de subida de archivos; el servidor corta antes de leer más. Por archivo: lo que pesa como mucho una foto
# de un reclamo (2 MB). Por pedido: las 3 fotos más los campos del formulario. Cada endpoint aplica además su
# propio límite (el logo de una comuna, 512 KB, lo revisa ComunaService).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=7MB
# Las fechas (Instant) viven en columnas TIMESTAMP y se guardan y leen en UTC.
# Sin esto Hibernate las lee como OffsetDateTime y el driver de Oracle falla con ORA-18716
# al cargar una fila desde la base (las pruebas no lo detectan porque reutilizan la entidad en memoria).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Swagger solo en desarrollo (se activa en application-dev.properties)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# JWT: el secreto viene de la variable de entorno JWT_SECRET (mínimo 32 caracteres, sin valor por defecto)
jwt.secret=${JWT_SECRET:}
jwt.expiracion=${JWT_EXPIRACION:4h}

# Direcciones aproximadas de un punto (GET /api/ubicacion/direccion): Nominatim, el buscador de OpenStreetMap.
# Servicio publico de uso moderado (alcanza para desarrollo y demostracion); la URL se puede cambiar por la de un servidor propio.
nominatim.url=https://nominatim.openstreetmap.org
# Opcional: correo de contacto que se agrega al User-Agent, como pide su politica de uso. Nunca se escribe en los registros.
nominatim.contacto=${NOMINATIM_CONTACTO:}

# Superadmin inicial: se crea al iniciar solo si no existe ninguno y las dos variables tienen valor
superadmin.correo=${SUPERADMIN_CORREO:}
superadmin.clave=${SUPERADMIN_CLAVE:}

# Correo: en desarrollo va a Mailpit (ver db/docker-compose.yml). En producción se pasan las variables MAIL_*.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CLAVE:}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.remitente=${MAIL_REMITENTE:no-responder@micomuna.local}
# Base de los enlaces que llegan por correo (invitaciones, recuperación de clave y avisos de cambio de estado): la dirección
# del frontend. En producción tiene que ser la dirección real, con https (variable FRONTEND_URL); si falta, los enlaces
# apuntan a localhost y no le sirven a nadie.
# Los avisos de cambio de estado a los vecinos son "al mejor esfuerzo": se mandan después de confirmar el cambio, en un
# hilo aparte y sin reintentos. Si el envío falla, queda registrado en el log (número de reclamo y comuna) y el cambio
# no se deshace.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Largo mínimo de la clave del superadmin inicial (en el perfil prod sube a 12)
superadmin.clave-minima=8

# IA que sugiere tipo y prioridad de cada reclamo nuevo (MC-24). Solo sugiere: la decisión es del personal municipal.
# Proveedor: ninguno (por defecto, no analiza y cada reclamo queda con la sugerencia OMITIDA) | claude | ollama.
# Claude necesita la variable ANTHROPIC_API_KEY (nunca en el repositorio ni en los logs): si falta, la aplicación arranca
# igual, avisa una vez en el log y los reclamos quedan sin sugerencia. Cada análisis de Claude cuesta plata.
micomuna.ia.proveedor=${MICOMUNA_IA_PROVEEDOR:ninguno}
# Análisis por día argentino y por comuna (se cuentan los que llamaron al proveedor: HECHA y ERROR); superado el tope, OMITIDA.
micomuna.ia.tope-diario=${MICOMUNA_IA_TOPE_DIARIO:200}
# Tope global: lo mismo pero sumando todas las comunas. Los dos topes son aproximados (con dos hilos analizando a la vez pueden
# pasarse en uno o dos análisis): el control real del gasto es el límite de gasto de la consola de Anthropic.
micomuna.ia.tope-diario-total=${MICOMUNA_IA_TOPE_DIARIO_TOTAL:1000}
# Tiempo máximo de espera del proveedor por análisis (segundos) y reintentos de Claude ante 429, 5xx o corte de conexión.
# Con un modelo local lento (Ollama sin GPU) conviene subir el tiempo de espera.
micomuna.ia.timeout-segundos=${MICOMUNA_IA_TIMEOUT_SEGUNDOS:20}
micomuna.ia.reintentos=1
micomuna.ia.claude.api-key=${ANTHROPIC_API_KEY:}
micomuna.ia.claude.modelo=${MICOMUNA_IA_CLAUDE_MODELO:claude-haiku-5-5}
# URL alternativa de Claude: SOLO para pruebas (un servidor simulado). En producción no se define. Si se define, tiene que
# ser https o el backend no arranca. Vacía usa la dirección oficial de la API.
micomuna.ia.claude.url=${MICOMUNA_IA_CLAUDE_URL:}
# Ollama solo acepta https, salvo localhost, 127.0.0.1, ::1 o una dirección privada (10.x, 172.16-31.x, 192.168.x): si no, el
# backend no arranca.
micomuna.ia.ollama.url=${OLLAMA_URL:http://localhost:11434}
micomuna.ia.ollama.modelo=${OLLAMA_MODELO:qwen3-vl}
