# Producción. Se activa con SPRING_PROFILES_ACTIVE=prod (sin perfil explícito se usa dev, que es solo para la máquina del desarrollador).
# Todo sale de variables de entorno: no hay valores por defecto con credenciales.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}

spring.jpa.show-sql=false

# La documentación de la API no se publica
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# El superadmin inicial exige una clave más larga
superadmin.clave-minima=12
