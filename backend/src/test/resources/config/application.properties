# Solo para las pruebas. Spring Boot lee classpath:/config/application.properties ademas de
# classpath:/application.properties (el de src/main), asi que este archivo suma propiedades sin reemplazar nada.

# Los controladores de prueba (RutaProtegidaDePrueba, RutaPorComunaDePrueba) viven bajo /api/prueba/**:
# no forman parte de la API real y no tienen que aparecer en /v3/api-docs ni en docs/api/openapi.yaml.
springdoc.paths-to-exclude=/api/prueba/**

# Cada contexto de Spring que las pruebas dejan guardado en cache mantiene su propio pool de conexiones a Oracle (10 por
# defecto, todas abiertas desde el arranque). Con unos treinta contextos se pasa el limite de procesos de la base de
# desarrollo (200) y los contextos nuevos fallan con ORA-17800 al conectarse. Se deja una sola conexion fija y las demas se
# abren cuando hacen falta y se cierran a los 10 segundos sin uso (el maximo sigue siendo 10, asi que las pruebas de
# concurrencia tienen las mismas conexiones disponibles).
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
